name: Build and validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Validate Supabase backend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install backend tools
        run: npm ci

      - name: Verify Supabase CLI
        run: npx --no-install supabase --version

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Test Edge Function validation
        working-directory: backend
        run: deno test supabase/functions/farm-weather/validation.test.ts

      - name: Validate migrations and backend contracts
        working-directory: backend
        run: deno run --node-modules-dir=auto --allow-read supabase/tests/embedded_migrations.ts

  frontend:
    name: Build Android debug frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        working-directory: frontend
        run: gradle --no-daemon assembleDebug
