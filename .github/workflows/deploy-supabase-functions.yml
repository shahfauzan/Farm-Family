name: Deploy Supabase functions

on:
  push:
    branches: [main]
    paths:
      - "backend/supabase/functions/**"
      - "backend/supabase/config.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-supabase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-functions-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Validate production secrets
        shell: bash
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF OPENAI_API_KEY OPENWEATHER_API_KEY; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Add $name to the production GitHub environment (project ref as a variable; other values as secrets)."
              exit 1
            fi
          done
          if [[ "$SUPABASE_PROJECT_REF" != "wkeotktsjwoejspyhprs" ]]; then
            echo "::error::SUPABASE_PROJECT_REF does not match the production project."
            exit 1
          fi
      - name: Apply Supabase Auth deep-link configuration
        working-directory: backend
        run: npx --no-install supabase config push --remote "$SUPABASE_PROJECT_REF" --yes
      - name: Deploy edge functions
        working-directory: backend
        run: npx --no-install supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
      - name: Sync model and weather credentials to Supabase
        working-directory: backend
        shell: bash
        run: |
          npx --no-install supabase secrets set \
            "OPENAI_API_KEY=$OPENAI_API_KEY" \
            "OPENWEATHER_API_KEY=$OPENWEATHER_API_KEY" \
            "OPENAI_MODEL=${OPENAI_MODEL:-gpt-4.1-mini}" \
            --remote "$SUPABASE_PROJECT_REF"
